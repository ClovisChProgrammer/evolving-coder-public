<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAI — Arte Viva · Camada 2: Oceano Abissal + Águas-Vivas</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    font: 11px/1.6 "Consolas", monospace; color: #7fd8d8;
    text-shadow: 0 0 6px rgba(0,255,220,.35); pointer-events: none;
    user-select: none;
  }
  #hud b { color: #f0b46a; font-weight: normal; }
  #bar {
    position: fixed; bottom: 12px; right: 14px; z-index: 10;
    font: 11px "Consolas", monospace; color: #7fd8d8;
    background: rgba(2,10,14,.72); border: 1px solid rgba(95,216,216,.35);
    border-radius: 4px; padding: 6px 8px; user-select: none;
  }
  #bar button {
    font: inherit; color: #7fd8d8; background: transparent;
    border: 1px solid rgba(95,216,216,.4); border-radius: 3px;
    padding: 2px 7px; margin-left: 5px; cursor: pointer;
  }
  #bar button.on { color: #04141a; background: #7fd8d8; border-color: #7fd8d8; }
  #fps { color: #f0b46a; min-width: 52px; display: inline-block; }
  #err {
    position: fixed; inset: 0; z-index: 99; display: none;
    color: #ff9c8a; background: #100404; padding: 24px;
    font: 12px/1.5 monospace; white-space: pre-wrap; overflow: auto;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">KAI · ARTE VIVA — <b>Camada 2/4</b>: Oceano Abissal + Águas-Vivas<br>arraste para orbitar</div>
<div id="bar"><span id="fps">-- fps</span>
  <button data-s="0.5">50%</button><button data-s="0.75" class="on">75%</button><button data-s="1">100%</button>
</div>
<pre id="err"></pre>

<script id="vs" type="x-shader">#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec3  iResolution;
uniform float iTime;
uniform int   iFrame;
uniform vec4  iMouse;

// ==================== Tunables (Intel HD friendly) ====================
const int   ITER_RAYMARCH = 10;   // ondas durante a marcha (template: 12)
const int   ITER_NORMALS  = 24;   // ondas para normais      (template: 36)
const int   RAYMARCH_STEPS = 56;  // passos de interseccao agua (template: 64)
const int   FBM_OCTAVES   = 5;    // nebulosa (orcamento skill: <= 6)
const float WATER_DEPTH   = 1.0;
const float CAMERA_HEIGHT = 1.5;
const float DRAG_MULT     = 0.38;
const float EXPOSURE      = 1.55;

// ==================== Hash sin-free (Dave Hoskins) ====================
float hash12(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * .1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.xx + p3.yz) * p3.zy);
}

// ==================== Value noise + FBM ====================
float noise(in vec2 x){
    vec2 p = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash12(p);
    float b = hash12(p + vec2(1.0, 0.0));
    float c = hash12(p + vec2(0.0, 1.0));
    float d = hash12(p + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
const mat2 M2 = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p){
    float f = 0.0, a = 0.5;
    for(int i = 0; i < FBM_OCTAVES; i++){
        f += a * (-1.0 + 2.0 * noise(p));
        p = M2 * p;
        a *= 0.5;
    }
    return f;
}

// ==================== Starfield ====================
float starLayer(vec2 su, float density, float t){
    vec2 g = floor(su), f = fract(su) - 0.5;
    vec2 off = (hash22(g) - 0.5) * 0.8;
    float h  = hash12(g + 7.7);
    float d  = length(f - off);
    float m  = smoothstep(0.10, 0.0, d);
    float tw = 0.65 + 0.35 * sin(t * (2.0 + 4.0 * h) + h * 40.0);
    return m * step(1.0 - density, h) * tw;
}

// ==================== Aguas-vivas bioluminescentes (Camada 2) ====================
float sdSegment(vec2 p, vec2 a, vec2 b){
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return length(pa - ba * h);
}

vec4 jelly(vec2 q, float t, float seed){
    if(dot(q, q) > 9.0){ return vec4(0.0); }

    float pulse = 0.5 + 0.5 * sin(t * 1.3 + seed * 17.0);

    vec2 be = q - vec2(0.0, 0.10);
    float dome = length(be * vec2(1.05, 1.25)) - (0.62 + 0.07 * pulse);
    float skirt = -0.28 - 0.10 * be.x * be.x
                + 0.05 * sin(be.x * 7.0 + t * 1.8 + seed * 3.0);
    float dbody = max(dome, skirt - be.y);

    float core = exp(-length(q - vec2(0.0, 0.24)) * 7.0);

    float dtn = 1e5;
    for(int i = 0; i < 5; i++){
        float fi   = float(i);
        float u    = fi / 4.0 * 2.0 - 1.0;
        float ph   = seed * 7.0 + fi * 1.93;
        float fq   = 0.9 + 0.45 * fract(seed + fi * 0.618);
        float x0   = u * 0.40 * (0.75 + 0.25 * pulse);
        vec2 prev  = vec2(x0, -0.06);
        for(int s = 1; s <= 4; s++){
            float h  = float(s) / 4.0;
            float sw = (0.05 + 0.26 * h) * sin(t * fq + ph + 2.6 * h);
            vec2 cur = vec2(x0 + sw, -0.06 - 0.88 * h);
            dtn  = min(dtn, sdSegment(q, prev, cur));
            prev = cur;
        }
    }

    float edge = exp(-abs(dbody) * 9.0) * 1.25
               + smoothstep(0.02, -0.30, dbody) * (0.22 + 0.30 * smoothstep(-0.1, 0.45, q.y))
               + exp(-dtn * 6.5) * 0.85;
    float amp  = edge * (0.55 + 0.45 * pulse);
    vec3 rgb   = mix(vec3(0.15, 0.95, 0.85), vec3(0.95, 0.70, 0.35), core * 0.55)
               * edge + vec3(0.90, 0.72, 0.38) * core * 0.45;
    return vec4(rgb * amp, amp);
}

// Individuos distintos em screen-space (regiao subaquatica da tela):
// A = grande/proximo/esquerda; B = pequeno/distante/direita com deriva propria.
vec3 jellyPair(vec2 uv, float t){
    vec3 acc = vec3(0.0);
    vec2 pA = vec2(-0.55 + 0.06 * sin(t * 0.11 + 1.0),
                   -0.28 + 0.07 * sin(t * 0.16));
    acc += jelly((uv - pA) / 0.20, t, 0.37).rgb * 0.95;
    vec2 pB = vec2(0.60 + 0.05 * sin(t * 0.13 + 3.1),
                   -0.62 + 0.09 * sin(t * 0.21 + 1.7));
    acc += jelly((uv - pB) / 0.11, t, 4.73).rgb * 0.55;
    return acc;
}

// ==================== Ceu abissal: nebulosa + estrelas + lua ====================
vec3 skyColor(vec3 rd, float t){
    vec3 col = mix(vec3(0.010, 0.016, 0.028),
                   vec3(0.004, 0.006, 0.014),
                   clamp(rd.y * 1.5 + 0.25, 0.0, 1.0));

    vec2 su   = rd.xz / (abs(rd.y) + 0.45);
    float fade = smoothstep(0.02, 0.20, rd.y);

    col += vec3(0.90, 0.95, 1.00)
         * (starLayer(su * 38.0,       0.06, t) * 0.9
          + starLayer(su * 90.0 + 13.1, 0.04, t) * 0.6) * fade;

    vec2 nb  = su * 1.4 + vec2(t * 0.008, -t * 0.005);
    float q  = fbm(nb);
    float f  = fbm(nb + 1.6 * vec2(q, q) + vec2(3.7));
    float band = exp(-pow((rd.y - 0.18) * 4.0, 2.0));
    float neb  = max(f, 0.0) * band;
    col += (vec3(0.10, 0.45, 0.55) * pow(neb, 1.6) * 1.1
          + vec3(0.22, 0.12, 0.38) * pow(neb, 2.6) * 0.8) * fade;
    col += vec3(0.85, 0.45, 0.15)
         * pow(max(fbm(nb * 0.7 + 11.3), 0.0), 3.5) * band * 0.5 * fade;

    vec3 md  = normalize(vec3(-0.55, 0.40, 0.35));
    float dm = max(dot(rd, md), 0.0);
    col += vec3(0.85, 0.95, 1.00) * (pow(dm, 3000.0) * 3.0 + pow(dm, 60.0) * 0.12);

    return col;
}

// ==================== Ondas exp(sin) + domain warping ====================
vec2 wavedx(vec2 position, vec2 direction, float frequency, float timeshift){
    float x    = dot(direction, position) * frequency + timeshift;
    float wave = exp(sin(x) - 1.0);
    float dx   = wave * cos(x);
    return vec2(wave, -dx);
}

float getwaves(vec2 position, int iterations){
    float wavePhaseShift = length(position) * 0.1;
    float iter = 0.0;
    float frequency = 1.0;
    float timeMultiplier = 2.0;
    float weight = 1.0;
    float sumOfValues = 0.0;
    float sumOfWeights = 0.0;
    for(int i = 0; i < iterations; i++){
        vec2 p   = vec2(sin(iter), cos(iter));
        vec2 res = wavedx(position, p, frequency, iTime * timeMultiplier + wavePhaseShift);
        position += p * res.y * weight * DRAG_MULT;
        sumOfValues  += res.x * weight;
        sumOfWeights += weight;
        weight = mix(weight, 0.0, 0.2);
        frequency *= 1.18;
        timeMultiplier *= 1.07;
        iter += 1232.399963;
    }
    return sumOfValues / sumOfWeights;
}

// ==================== Marcha delimitada no volume da agua ====================
float intersectPlane(vec3 origin, vec3 direction, vec3 point, vec3 normal){
    return clamp(dot(point - origin, normal) / dot(direction, normal), -1.0, 9991999.0);
}

float raymarchwater(vec3 camera, vec3 start, vec3 end, float depth){
    vec3 pos = start;
    vec3 dir = normalize(end - start);
    for(int i = 0; i < RAYMARCH_STEPS; i++){
        float height = getwaves(pos.xz, ITER_RAYMARCH) * depth - depth;
        if(height + 0.01 > pos.y){ return distance(pos, camera); }
        pos += dir * (pos.y - height);
    }
    return distance(start, camera);
}

vec3 calcNormal(vec2 pos, float e, float depth){
    vec2 ex = vec2(e, 0.0);
    float H = getwaves(pos.xy, ITER_NORMALS) * depth;
    vec3 a  = vec3(pos.x, H, pos.y);
    return normalize(cross(
        a - vec3(pos.x - e, getwaves(pos.xy - ex.xy, ITER_NORMALS) * depth, pos.y),
        a - vec3(pos.x,     getwaves(pos.xy + ex.yx, ITER_NORMALS) * depth, pos.y + e)));
}

// ==================== Camera orbital via mouse ====================
mat3 rotAxis(vec3 axis, float angle){
    float s = sin(angle), c = cos(angle), oc = 1.0 - c;
    return mat3(
        oc*axis.x*axis.x + c,          oc*axis.x*axis.y - axis.z*s,    oc*axis.z*axis.x + axis.y*s,
        oc*axis.x*axis.y + axis.z*s,   oc*axis.y*axis.y + c,           oc*axis.y*axis.z - axis.x*s,
        oc*axis.z*axis.x - axis.y*s,   oc*axis.y*axis.z + axis.x*s,    oc*axis.z*axis.z + c);
}

vec3 getRay(vec2 fragCoord, vec2 nm){
    vec2 uv = ((fragCoord.xy / iResolution.xy) * 2.0 - 1.0)
            * vec2(iResolution.x / iResolution.y, 1.0);
    vec3 proj = normalize(vec3(uv.x, uv.y, 1.5));
    float ay = (nm.y == 0.0) ? 0.27 : nm.y;
    return rotAxis(vec3(0.0, -1.0, 0.0), 3.0 * ((nm.x + 0.5) * 2.0 - 1.0))
         * rotAxis(vec3(1.0,  0.0, 0.0), 0.5 + 1.5 * (ay * 2.0 - 1.0)) * proj;
}

// ==================== Tone mapping ACES ====================
vec3 aces_tonemap(vec3 color){
    mat3 m1 = mat3(
        0.59719, 0.07600, 0.02840,
        0.35458, 0.90834, 0.13383,
        0.04823, 0.01566, 0.83777);
    mat3 m2 = mat3(
        1.60475, -0.10208, -0.00327,
       -0.53108,  1.10813, -0.07276,
       -0.07367, -0.00605,  1.07602);
    vec3 v = m1 * color;
    vec3 a = v * (v + 0.0245786) - 0.000090537;
    vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
    return pow(clamp(m2 * (a / b), 0.0, 1.0), vec3(1.0 / 2.2));
}

// ==================== Main ====================
void mainImage(out vec4 fragColor, in vec2 fragCoord){
    vec2 nm = iMouse.xy / iResolution.xy;
    vec3 ray = getRay(fragCoord, nm);

    if(ray.y >= 0.0){
        fragColor = vec4(aces_tonemap(skyColor(ray, iTime) * EXPOSURE), 1.0);
        return;
    }

    vec3 origin = vec3(iTime * 0.2, CAMERA_HEIGHT, 1.0);
    vec3 hi = vec3(0.0, 0.0, 0.0);
    vec3 lo = vec3(0.0, -WATER_DEPTH, 0.0);
    vec3 nUp = vec3(0.0, 1.0, 0.0);

    vec3 highHitPos = origin + ray * intersectPlane(origin, ray, hi, nUp);
    vec3 lowHitPos  = origin + ray * intersectPlane(origin, ray, lo, nUp);

    float dist = raymarchwater(origin, highHitPos, lowHitPos, WATER_DEPTH);
    vec3 waterHitPos = origin + ray * dist;

    vec3 N = calcNormal(waterHitPos.xz, 0.01, WATER_DEPTH);
    N = mix(N, vec3(0.0, 1.0, 0.0), 0.8 * min(1.0, sqrt(dist * 0.01) * 1.1));

    float fresnel = 0.04 + 0.96 * pow(1.0 - max(0.0, dot(-N, ray)), 5.0);

    vec3 R = normalize(reflect(ray, N));
    R.y = abs(R.y);
    vec3 reflection = skyColor(R, iTime);

    float hNorm = (waterHitPos.y + WATER_DEPTH) / WATER_DEPTH;
    vec3 scattering = vec3(0.008, 0.035, 0.060) * 0.9 * (0.2 + hNorm);

    vec3 C = fresnel * reflection + scattering;

    float bio = smoothstep(0.78, 1.0, hNorm) * exp(-dist * 0.05);
    C += vec3(0.10, 0.85, 0.75) * bio * 0.22
       * (0.6 + 0.4 * sin(iTime * 2.0 + waterHitPos.x * 3.0 + waterHitPos.z * 2.0));

    float fogF = 1.0 - exp(-dist * 0.012);
    C = mix(C, vec3(0.010, 0.026, 0.045), fogF * 0.7);

    C += jellyPair((2.0 * fragCoord - iResolution.xy) / iResolution.y, iTime);

    fragColor = vec4(aces_tonemap(C * EXPOSURE), 1.0);
}

void main(){
    mainImage(fragColor, gl_FragCoord.xy);
}
</script>

<script>
// ===== estado primeiro (TDZ-safe) =====
let scale = 0.75;
let frameCount = 0;
let startTime = Date.now();
let fpsFrames = 0;
let fpsLast = performance.now();
let dragging = false;
const mouse = { x: 0, y: 0, dx: 0, dy: 0 };

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false });
const errBox = document.getElementById('err');
const fpsEl = document.getElementById('fps');

function fail(msg){
  errBox.style.display = 'block';
  errBox.textContent = msg;
}

if(!gl){
  fail('WebGL2 não disponível neste navegador.\n' +
       'A Intel HD 5500 suporta WebGL2 — verifique se a aceleração de hardware está ativa.');
}else{
  const vsSrc = document.getElementById('vs').text.trim();
  const fsSrc = document.getElementById('fs').text.trim();

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      fail('Erro de compilação GLSL:\n' + gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vs = compile(gl.VERTEX_SHADER, vsSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    fail('Erro de link:\n' + gl.getProgramInfoLog(prog));
  }else{
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const locP = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(locP);
    gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

    const U = {};
    for(const n of ['iResolution','iTime','iFrame','iMouse']){
      U[n] = gl.getUniformLocation(prog, n); // pode ser null se otimizado fora
    }

    function resize(){
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width  = Math.max(2, Math.round(innerWidth  * dpr * scale));
      canvas.height = Math.max(2, Math.round(innerHeight * dpr * scale));
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    canvas.addEventListener('mousedown', e => {
      dragging = true;
      mouse.dx = e.clientX; mouse.dy = e.clientY;
    });
    window.addEventListener('mouseup', () => { dragging = false; });
    window.addEventListener('mousemove', e => {
      if(dragging){
        mouse.x += (e.clientX - mouse.dx);
        mouse.y += (e.clientY - mouse.dy);
        mouse.dx = e.clientX; mouse.dy = e.clientY;
      }
    });

    document.querySelectorAll('#bar button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#bar button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        scale = parseFloat(b.dataset.s);
        resize();
      });
    });

    function render(){
      const t = (Date.now() - startTime) / 1000;
      frameCount++;
      if(U.iResolution) gl.uniform3f(U.iResolution, canvas.width, canvas.height, 1.0);
      if(U.iTime)       gl.uniform1f(U.iTime, t);
      if(U.iFrame)      gl.uniform1i(U.iFrame, frameCount);
      if(U.iMouse)      gl.uniform4f(U.iMouse, mouse.x, mouse.y, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      fpsFrames++;
      const now = performance.now();
      if(now - fpsLast >= 500){
        const fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
        fpsEl.textContent = fps + ' fps';
        fpsFrames = 0;
        fpsLast = now;
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }
}
</script>
</body>
</html>
